# The backend: "keep one pod of its image running", and a fixed address for that pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: PROJECT
spec:
  # more than one only if the backend keeps nothing in its own memory between requests
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/remuriin/PROJECT-api:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # every setting of the backend's .env, from a secret created by hand on the VPS:
          #   sudo kubectl -n PROJECT create secret generic backend-env --from-env-file=<the .env file>
          # The values are never in the repository or in the image. Without the secret the pod does not start.
          envFrom:
            - secretRef:
                name: backend-env
          # A value here wins over the same name in the secret. Inside a pod "localhost" is the pod,
          # so something that runs on the VPS itself (Postgres) is named by the VPS's own address:
          # env:
          #   - name: DB_HOST
          #     value: "10.0.0.135"
          # an address of the backend that answers 200 without a login, once it is ready to work
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            # the "node" user of the image, by number
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: PROJECT
spec:
  type: ClusterIP
  clusterIP: API_IP
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 3000
