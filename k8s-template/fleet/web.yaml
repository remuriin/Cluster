# The web app: "keep one pod of its image running", and a Service in front of it. The front door
# finds it by name (route.yaml), so no address is chosen by hand. Flux's image automation keeps the image line on
# the newest build of main (the marker at its end).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app-PROJECT
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/remuriin/PROJECT-web:WEB_TAG # {"$imagepolicy": "flux-system:app-PROJECT-web"}
          ports:
            - containerPort: WEB_PORT
          # traffic is only sent to the pod once this answers
          readinessProbe:
            httpGet:
              path: WEB_HEALTH
              port: WEB_PORT
            periodSeconds: 5
          # requests: what it is promised. limits: the ceiling it can never go over.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: WEB_MEMMi
          securityContext:
            # an image that runs as root is refused
            runAsNonRoot: true
            runAsUser: WEB_USER
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: app-PROJECT
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: WEB_PORT
