# The box that holds everything of this project in the cluster. Its name starts with app-, which is
# what lets the generic nginx site reach it at PROJECT.remservers.me. The mark says which repository
# it belongs to: k8s-launch reads it back to know a project it launched before.
apiVersion: v1
kind: Namespace
metadata:
  name: app-PROJECT
  annotations:
    remservers.me/repo: remuriin/REPO
