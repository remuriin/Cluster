# The box that holds everything of this project in the cluster. The label lets its route (route.yaml)
# attach to the front door at PROJECT.remservers.me. The mark says which repository it belongs to: k8s-launch reads
# it back to know a project it launched before.
apiVersion: v1
kind: Namespace
metadata:
  name: app-PROJECT
  labels:
    remservers.me/gateway: "true"
  annotations:
    remservers.me/repo: remuriin/REPO
