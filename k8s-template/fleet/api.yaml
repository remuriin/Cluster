# The backend: "keep one pod of its image running", and a Service in front of it. The front door
# sends PROJECT.remservers.me/api to it (route.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app-PROJECT
spec:
  # more than one only if the backend keeps nothing in its own memory between requests
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/remuriin/PROJECT-api:API_TAG # {"$imagepolicy": "flux-system:app-PROJECT-api"}
          ports:
            - containerPort: API_PORT
          # every setting of the backend's .env, from the Secret Flux makes out of backend.env in this
          # folder (encrypted with SOPS; only the cluster can read it). A project without settings
          # starts without them.
          envFrom:
            - secretRef:
                name: backend-env
                optional: true
          # A value here wins over the same name in the settings. Inside a pod "localhost" is the pod,
          # so something that runs on the VPS itself (Postgres) is named by the VPS's own address:
          # env:
          #   - name: DB_HOST
          #     value: "10.0.0.135"
          # an address of the backend that answers 200 without a login, once it is ready to work
          readinessProbe:
            httpGet:
              path: API_HEALTH
              port: API_PORT
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: API_MEMMi
          securityContext:
            # an image that runs as root is refused
            runAsNonRoot: true
            # the user the image runs as, by number (1000 is the "node" user of the Node images)
            runAsUser: API_USER
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: app-PROJECT
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: API_PORT
