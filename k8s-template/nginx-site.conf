# The VPS's nginx site for this project. Install as /etc/nginx/sites-available/PROJECT, link it into
# sites-enabled, then let certbot add the certificate and the HTTPS half:
#   sudo certbot --nginx -d SITE_NAME
# nginx is the only way in: the addresses below exist only inside the VPS.

server {
    listen 80;
    server_name SITE_NAME;

    # api:begin
    # the backend's pod
    location /api {
        include /etc/nginx/snippets/rag-headers.conf;
        proxy_pass http://API_IP;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # api:end

    # the web app's pod (it sets the caching itself)
    location / {
        include /etc/nginx/snippets/rag-headers.conf;
        proxy_pass http://WEB_IP;
        proxy_set_header Host $host;
    }
}
