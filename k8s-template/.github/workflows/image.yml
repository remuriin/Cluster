# On a push to main: build this project's container images and make the cluster run them.
# The VPS never builds anything.
name: image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # api:begin
      - 'backend/**'
      # api:end
      - '.github/workflows/image.yml'
  # also a "Run workflow" button on the Actions page
  workflow_dispatch:

# only pushes to this repository run it; a pull request from a fork never does
permissions:
  contents: read
  packages: write

# two pushes in a row run one after the other, never at once
concurrency: image

jobs:
  # A gate before the build goes here if the project has a linter or tests: a job like "check" in
  # RaaS/.github/workflows/image.yml, and "needs: check" on the build job. A type error already
  # stops the build, because the type check runs inside it.
  build:
    # an ARM machine, the same kind of CPU as the VPS
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: web app
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          # one tag that names this exact commit, and "main" that always points at the newest
          tags: |
            ghcr.io/remuriin/PROJECT-web:${{ github.sha }}
            ghcr.io/remuriin/PROJECT-web:main
          # repository variables the build needs, one per ARG line in frontend/Dockerfile:
          # build-args: |
          #   VITE_API_URL=${{ vars.VITE_API_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/REPO

      # api:begin
      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/remuriin/PROJECT-api:${{ github.sha }}
            ghcr.io/remuriin/PROJECT-api:main
          labels: |
            org.opencontainers.image.source=https://github.com/remuriin/REPO
      # api:end

  # Logs in to the VPS as the "deploy" user. This repository's key can do one thing there: ask for a
  # deployment in the PROJECT namespace to run the image of a commit (k8s-deploy in the Cluster repository).
  # That script waits for the new pod, and goes back to the old image by itself if it is not healthy,
  # which makes this job fail.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: make the cluster run this commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "the DEPLOY_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh
          # the VPS's public host key, so the key is only ever offered to the real VPS
          echo "140.245.60.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBanLnPlG+CZMZyISZMZcqZRg3x0MIBK7sYoCjenpObq" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$DEPLOY_KEY" > ~/.ssh/deploy
          ssh -i ~/.ssh/deploy deploy@140.245.60.8 "web $GITHUB_SHA"
          # api:begin
          ssh -i ~/.ssh/deploy deploy@140.245.60.8 "api $GITHUB_SHA"
          # api:end
